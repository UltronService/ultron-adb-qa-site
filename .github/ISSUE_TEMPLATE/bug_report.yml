name: Bug Report
description: Report a bug found during manual or automated STB QA
title: "[Bug] "
labels:
  - bug
  - stb
body:
  - type: input
    id: apk_version
    attributes:
      label: APK 版本
      description: Version name or build number under test
      placeholder: "2.1.0 (210)"
    validations:
      required: true

  - type: input
    id: stb_info
    attributes:
      label: STB 型號 / IP
      description: Device model and IP address
      placeholder: "STB-176 / 192.168.1.176:5555"
    validations:
      required: true

  - type: input
    id: test_case_id
    attributes:
      label: 測試案例 ID
      description: Reference test case from docs/test-cases/
      placeholder: TC-BOOT-001
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: 重現步驟
      description: Steps to reproduce the issue
      placeholder: |
        1. Install APK v2.1.0
        2. Launch app on STB-176
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected_actual
    attributes:
      label: 預期結果 vs 實際結果
      description: What should happen vs what actually happened
    validations:
      required: true

  - type: textarea
    id: logcat
    attributes:
      label: Logcat 片段
      description: Relevant log lines (Error / FATAL)
    validations:
      required: false

  - type: textarea
    id: screenshot
    attributes:
      label: 截圖說明
      description: Describe or link to screenshot if available
    validations:
      required: false
